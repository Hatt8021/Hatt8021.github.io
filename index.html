<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John Phφe | Ranking</title>
<style>
:root {
  color-scheme: dark;
  --bg: #090909;
  --panel: #141414;
  --gold: #c6a96b;
  --text: #f4f1e9;
  --muted: #99958b;
  --line: #302d26;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}
header {
  padding: 42px 20px 28px;
  text-align: center;
  border-bottom: 1px solid var(--line);
}
.eyebrow {
  color: var(--gold);
  letter-spacing: .3em;
  font-size: 11px;
}
h1 {
  font-size: clamp(27px, 6vw, 46px);
  letter-spacing: .06em;
  margin: 14px 0 8px;
}
.subtitle {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .15em;
}
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 26px 16px 60px;
}
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}
.tabs button {
  flex: 1;
  padding: 13px 5px;
  background: #111;
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 3px;
  font-size: 13px;
}
.tabs button.active {
  background: var(--gold);
  color: #111;
  border-color: var(--gold);
  font-weight: 700;
}
.section-title {
  font-size: 12px;
  color: var(--gold);
  letter-spacing: .2em;
  margin: 0 0 14px;
}
#ranking {
  display: grid;
  gap: 10px;
}
.song {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) 58px;
  gap: 12px;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 17px 14px;
  border-radius: 4px;
}
  
/* Top 3 ranking cards */

/* First-place trophy: thick gold frame */
.song.rank-1 .rank {
  position: relative;
  width: 46px;
  height: 52px;
  margin: 0 auto;
  padding: 0;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  outline: none;
  clip-path: none;
  filter: none;
  font-size: 0;
}

.song.rank-1 .trophy-frame {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: block;
  background: linear-gradient(
    135deg,
    #fff2b0,
    #d4af37,
    #9c7118
  );
  clip-path: polygon(
    10% 0, 90% 0,
    90% 35%, 100% 45%,
    88% 68%, 70% 68%,
    65% 100%, 35% 100%,
    30% 68%, 12% 68%,
    0 45%, 10% 35%
  );
}

.song.rank-1 .trophy-face {
  position: absolute;
  inset: 5px;
  z-index: 1;
  display: block;
  background: linear-gradient(
    135deg,
    #b8860b,
    #f8e7a5,
    #d4af37
  );
  clip-path: polygon(
    10% 0, 90% 0,
    90% 35%, 100% 45%,
    88% 68%, 70% 68%,
    65% 100%, 35% 100%,
    30% 68%, 12% 68%,
    0 45%, 10% 35%
  );
}

.song.rank-1 .rank-number {
  position: relative;
  z-index: 2;
  display: block;
  color: #090909;
  font-size: 19px;
  font-weight: 900;
  line-height: 1;
}

.song.rank-2 {
padding: 17px 14px;
border: 2px solid #aeb5bf;
background: #191919;
min-height: 0;
}
.song.rank-3 {
padding: 17px 14px;
border: 2px solid #b77a50;
background: #1d1713;
min-height: 0;
}

.rank {
  color: var(--gold);
  font-size: 24px;
  text-align: center;
  font-weight: 300;
}
.song-name {
  font-size: 14px;
  overflow-wrap: anywhere;
  line-height: 1.5;
}
.song-meta {
  color: var(--muted);
  font-size: 11px;
  margin-top: 6px;
  line-height: 1.7;
}
.score {
  text-align: right;
  font-size: 20px;
  white-space: nowrap;
}
.score small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
}
.note {
  margin-top: 28px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.9;
  text-align: center;
}
footer {
  border-top: 1px solid var(--line);
  padding: 22px 12px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .08em;
}

@media (max-width: 420px) {
  main {
    padding: 20px 10px 40px;
  }

  .song {
    grid-template-columns: 36px minmax(0, 1fr) 58px;
    gap: 8px;
    padding: 14px 9px;
  }

  .song.rank-1 .rank {
    width: 36px;
    height: 42px;
  }

  .song.rank-2,
  .song.rank-3 {
    padding: 14px 9px;
    min-height: 0;
  }

  .rank {
    font-size: 20px;
  }

  .song-name {
    font-size: 13px;
    overflow-wrap: anywhere;
  }

  .song-meta {
    font-size: 10px;
  }

  .score {
    min-width: 0;
    font-size: 16px;
  }
}

</style>
</head>
<body>
<header>
  <div class="eyebrow">OFFICIAL MUSIC RANKING</div>
  <h1>John Phφe</h1>
  <div class="subtitle">MUSIC ARCHIVE / RANKING</div>
</header>
<main>
  <div class="tabs">
    <button class="active" data-type="gbuc">GBUC</button>
    <button data-type="eggs">Eggs</button>
    <button data-type="overall">Overall</button>
  </div>
  <h2 class="section-title" id="heading">GBUC RANKING</h2>
  <div id="ranking"></div>
  <p class="note">
    Ranking data is manually maintained.<br>
    Last updated: <span id="updated">—</span><br>
    John Phφe · Independent Music Project
  </p>
</main>
<footer>JOHN PHφE © MUSIC RANKING</footer>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTKmDAfBSUBfppjvD4xAVZkCqlTKHm7Faa6Ijn1ut638e9LIIU9_pwyYlPdz10RQxF3zmWU2QKdK-e1/pub?gid=0&single=true&output=csv";

let songs = [];
let type = "gbuc";

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === '"' && quoted && text[i + 1] === '"') {
      cell += '"';
      i++;
    } else if (c === '"') {
      quoted = !quoted;
    } else if (c === "," && !quoted) {
      row.push(cell);
      cell = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell);
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += c;
    }
  }

  row.push(cell);
  if (row.some(v => v.trim() !== "")) rows.push(row);
  return rows;
}

function num(v) {
  const n = Number(String(v ?? "").replace(/,/g, "").trim());
  return Number.isFinite(n) ? n : 0;
}

function escapeHTML(v) {
  return String(v).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

async function loadSongs() {
  const box = document.getElementById("ranking");
  box.innerHTML = '<p class="note">Loading ranking data...</p>';

  try {
    const response = await fetch(CSV_URL);
    if (!response.ok) throw new Error("CSV load failed");

    const rows = parseCSV(await response.text());
    if (rows.length < 2) throw new Error("No data");

    songs = rows.slice(1)
      .filter(r => r[0] && r[0].trim())
      .map(r => ({
        name: r[0].trim(),
        bp: num(r[1]),
        bv: num(r[2]),
        ep: num(r[3]),
        el: num(r[4]),
        updated: r[5] || "",
        gr: num(r[6]),
        er: num(r[7]),
        score: r[8] === "" ? null : num(r[8]),
        jr: num(r[9])
      }));

    const dates = songs.map(s => s.updated).filter(Boolean);
    document.getElementById("updated").textContent =
      dates.length ? dates[dates.length - 1] : "—";

    render();
  } catch (e) {
    box.innerHTML =
      '<p class="note">ランキングを読み込めませんでした。公開設定や列の順番を確認してください。</p>';
    console.error(e);
  }
}

function render() {
  let ranked = [...songs];

  if (type === "gbuc") {
    ranked.sort((a, b) => (a.gr || 999999) - (b.gr || 999999));
  } else if (type === "eggs") {
    ranked.sort((a, b) => (a.er || 999999) - (b.er || 999999));
  } else {
    ranked.sort((a, b) => (a.jr || 999999) - (b.jr || 999999));
  }

  document.getElementById("heading").textContent =
    type === "gbuc" ? "GBUC RANKING" :
    type === "eggs" ? "EGGS RANKING" :
    "OVERALL RANKING";

  document.getElementById("ranking").innerHTML = ranked.map((s, i) => {
    const rank = type === "gbuc" ? s.gr :
      type === "eggs" ? s.er : s.jr;

    const meta = type === "gbuc"
      ? `Plays: ${s.bp} / Votes: ${s.bv}`
      : type === "eggs"
      ? `Plays: ${s.ep} / Likes: ${s.el}`
      : `GBUC: ${s.bp} plays / Eggs: ${s.ep} plays`;

    const score = type === "gbuc" ? s.bp :
      type === "eggs" ? s.ep :
      (s.score === null ? "—" : s.score.toFixed(1));

    const label = type === "overall" ? "平均順位" : "再生数";

    return `
      <article class="song ${i < 3 ? `rank-${i + 1}` : ""}">
    <div class="rank">
  ${
    i === 0
      ? `<span class="trophy-frame">
           <span class="trophy-face"></span>
         </span>
         <span class="rank-number">1</span>`
      : i === 1 ? "2" : i === 2 ? "3" : (rank || i + 1)
  }
</div>
        <div>
          <div class="song-name">${escapeHTML(s.name)}</div>
          <div class="song-meta">${meta}</div>
        </div>
        <div class="score">
          ${score}
          <small>${label}</small>
        </div>
      </article>`;
  }).join("");
}

document.querySelectorAll(".tabs button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tabs button")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");
    type = button.dataset.type;
    render();
  });
});

loadSongs();
</script>
</body>
</html>
